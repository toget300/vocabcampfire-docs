<h1>單字營火</h1><p>拼對一個英文單字，就是往火裡添一根柴。</p>
<h2>常見問題</h2>
<p><b>換手機時進度會保留嗎？</b><br>目前進度存在手機本機，換手機或刪除 App 會重新開始。</p>
<p><b>聽不到單字發音？</b><br>請確認手機沒有開靜音，並把音量調大。</p>
<p><b>小怪獸怎麼來的？</b><br>同一個單字拼對 5 次會得到卡包，打開就會變成小怪獸，幫你添柴、打退入侵者。</p>
